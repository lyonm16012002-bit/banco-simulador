<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banca Virtual | Banco Simulador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand fw-bold">Banca Virtual</span>
      <div class="d-flex align-items-center gap-3 text-white">
        <span id="nombreUsuario" class="d-none d-sm-inline"></span>
        <button class="btn btn-outline-light btn-sm" id="btnSalir">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="alertaGlobal" class="alert d-none" role="alert"></div>

    <ul class="nav nav-tabs mb-4 flex-nowrap tabla-scroll" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabResumen" type="button">Resumen</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMovimientos" type="button">Movimientos</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabTransferir" type="button">Transferir</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPerfil" type="button">Mi perfil</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPassword" type="button">Contraseña</button></li>
    </ul>

    <div class="tab-content">
      <!-- RESUMEN -->
      <div class="tab-pane fade show active" id="tabResumen">
        <div class="mb-3" id="bloqueSelectorCuenta">
          <label for="selCuenta" class="form-label fw-semibold">Cuenta</label>
          <select id="selCuenta" class="form-select" style="max-width: 360px"></select>
        </div>
        <div class="row g-3">
          <div class="col-12 col-lg-6">
            <div class="card tarjeta-dato h-100"><div class="card-body">
              <div class="text-muted">Saldo disponible</div>
              <div class="saldo-grande" id="saldoValor">—</div>
            </div></div>
          </div>
          <div class="col-12 col-lg-6">
            <div class="card tarjeta-dato h-100"><div class="card-body">
              <dl class="row mb-0">
                <dt class="col-5">Número de cuenta</dt><dd class="col-7" id="cuentaNumero">—</dd>
                <dt class="col-5">Tipo de cuenta</dt><dd class="col-7" id="cuentaTipo">—</dd>
                <dt class="col-5">Estado</dt><dd class="col-7 mb-0" id="cuentaEstado">—</dd>
              </dl>
            </div></div>
          </div>
        </div>
      </div>

      <!-- MOVIMIENTOS -->
      <div class="tab-pane fade" id="tabMovimientos">
        <div class="card tarjeta-dato"><div class="card-body">
          <div class="tabla-scroll">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th class="text-end">Valor</th><th class="text-end">Saldo resultante</th></tr></thead>
              <tbody id="tbMovimientos"></tbody>
            </table>
          </div>
        </div></div>
      </div>

      <!-- TRANSFERIR -->
      <div class="tab-pane fade" id="tabTransferir">
        <div class="card tarjeta-dato" style="max-width: 560px"><div class="card-body">
          <h2 class="h5 mb-3">Transferir a otra cuenta</h2>
          <div id="alertaTransferir" class="alert d-none" role="alert"></div>
          <form id="formTransferir" novalidate>
            <div class="mb-3">
              <label for="trOrigen" class="form-label">Cuenta de origen</label>
              <select id="trOrigen" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label for="trDestino" class="form-label">Número de cuenta destino</label>
              <input type="text" inputmode="numeric" class="form-control" id="trDestino" maxlength="20" placeholder="Ej: 1001000002" required>
            </div>
            <div class="mb-3">
              <label for="trMonto" class="form-label">Valor a transferir (COP)</label>
              <input type="number" class="form-control" id="trMonto" min="1" step="0.01" required>
            </div>
            <div class="mb-3">
              <label for="trDescripcion" class="form-label">Descripción (opcional)</label>
              <input type="text" class="form-control" id="trDescripcion" maxlength="60">
            </div>
            <button type="submit" class="btn btn-primary w-100">Transferir</button>
          </form>
        </div></div>
      </div>

      <!-- PERFIL -->
      <div class="tab-pane fade" id="tabPerfil">
        <div class="card tarjeta-dato" style="max-width: 640px"><div class="card-body">
          <h2 class="h5 mb-3">Información personal</h2>
          <div id="alertaPerfil" class="alert d-none" role="alert"></div>
          <form id="formPerfil" novalidate>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="pfDocumento">Documento</label><input class="form-control" id="pfDocumento" readonly></div>
              <div class="col-md-6"><label class="form-label" for="pfNombres">Nombres</label><input class="form-control" id="pfNombres" readonly></div>
              <div class="col-md-6"><label class="form-label" for="pfApellidos">Apellidos</label><input class="form-control" id="pfApellidos" readonly></div>
              <div class="col-md-6"><label class="form-label" for="pfEmail">Correo electrónico</label><input type="email" class="form-control" id="pfEmail" maxlength="120" required></div>
              <div class="col-md-6"><label class="form-label" for="pfTelefono">Teléfono</label><input class="form-control" id="pfTelefono" maxlength="20"></div>
              <div class="col-md-6"><label class="form-label" for="pfDireccion">Dirección</label><input class="form-control" id="pfDireccion" maxlength="150"></div>
            </div>
            <p class="text-muted small mt-3 mb-3">Los datos de identificación solo puede modificarlos el banco.</p>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </form>
        </div></div>
      </div>

      <!-- CONTRASEÑA -->
      <div class="tab-pane fade" id="tabPassword">
        <div class="card tarjeta-dato" style="max-width: 460px"><div class="card-body">
          <h2 class="h5 mb-3">Cambiar contraseña</h2>
          <div id="alertaPassword" class="alert d-none" role="alert"></div>
          <form id="formPassword" novalidate>
            <div class="mb-3"><label class="form-label" for="pwActual">Contraseña actual</label><input type="password" class="form-control" id="pwActual" autocomplete="current-password" required></div>
            <div class="mb-3"><label class="form-label" for="pwNueva">Nueva contraseña</label><input type="password" class="form-control" id="pwNueva" autocomplete="new-password" required><div class="form-text">Mínimo 8 caracteres, con letras y números.</div></div>
            <div class="mb-3"><label class="form-label" for="pwConfirmacion">Confirmar nueva contraseña</label><input type="password" class="form-control" id="pwConfirmacion" autocomplete="new-password" required></div>
            <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
          </form>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/sesion.js" data-rol="CLIENTE"></script>
  <script src="/js/cliente.js"></script>
</body>
</html>
