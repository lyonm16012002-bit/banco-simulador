<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Banco Simulador</title>
  <!-- Bootstrap (CSS por CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos propios -->
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body class="fondo-login">
  <main class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card tarjeta-login shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="h3 fw-bold text-primary">Banco Simulador</h1>
          <p class="text-muted mb-0">Ingresa a tu banca virtual</p>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
            <div class="invalid-feedback">Ingresa un correo válido.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
            <div class="invalid-feedback">La contraseña es obligatoria.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="btnIngresar">Ingresar</button>
        </form>
        <hr class="my-4">
        <div class="text-center">
          <a href="/html/cajero.html" class="btn btn-outline-secondary btn-sm">Ir al cajero automático</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
