<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cajero Automático | Banco Simulador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body class="fondo-cajero">
  <main class="container d-flex flex-column align-items-center justify-content-center py-4" style="min-height: 100vh">
    <div class="cajero-carcasa">
      <div class="text-center text-white mb-3">
        <div class="h4 fw-bold mb-0">Banco Simulador</div>
        <div class="small opacity-75">Cajero Automático</div>
      </div>

      <div class="cajero-pantalla">
        <div id="mensajeCajero" class="alert d-none" role="alert"></div>

        <!-- IDENTIFICACIÓN -->
        <section id="seccionLogin">
          <h2 class="h4 text-center mb-4">Bienvenido</h2>
          <form id="formCajero" novalidate>
            <div class="mb-3">
              <label for="cjCuenta" class="form-label">Número de cuenta</label>
              <input type="text" inputmode="numeric" class="form-control" id="cjCuenta" maxlength="20" autocomplete="off" required>
            </div>
            <div class="mb-4">
              <label for="cjPin" class="form-label">PIN</label>
              <input type="password" inputmode="numeric" class="form-control" id="cjPin" maxlength="4" autocomplete="off" required>
            </div>
            <button type="submit" class="btn btn-info w-100 btn-cajero">Ingresar</button>
          </form>
        </section>

        <!-- MENÚ -->
        <section id="seccionMenu" class="d-none">
          <h2 class="h5 text-center mb-1">Hola, <span id="titularCajero"></span></h2>
          <p class="text-center small opacity-75 mb-4">¿Qué deseas hacer?</p>
          <div class="row g-3">
            <div class="col-6"><button class="btn btn-outline-info w-100 btn-cajero" id="btnSaldo">Consultar saldo</button></div>
            <div class="col-6"><button class="btn btn-outline-info w-100 btn-cajero" id="btnRetirar">Retirar dinero</button></div>
            <div class="col-6"><button class="btn btn-outline-info w-100 btn-cajero" id="btnMovs">Últimos movimientos</button></div>
            <div class="col-6"><button class="btn btn-outline-warning w-100 btn-cajero" id="btnSalir">Salir</button></div>
          </div>
        </section>

        <!-- SALDO -->
        <section id="seccionSaldo" class="d-none text-center">
          <h2 class="h5">Saldo disponible</h2>
          <div class="cajero-saldo my-3" id="cjSaldo">—</div>
          <p class="small opacity-75">Cuenta <span id="cjCuentaInfo"></span></p>
          <button class="btn btn-outline-info volver-menu mt-2">Volver al menú</button>
        </section>

        <!-- RETIRO -->
        <section id="seccionRetiro" class="d-none">
          <h2 class="h5 text-center mb-3">Retirar dinero</h2>
          <div id="bloqueRetiro">
            <div class="row g-2 mb-3">
              <div class="col-6"><button class="btn btn-outline-info w-100 monto-rapido" data-valor="50000">$ 50.000</button></div>
              <div class="col-6"><button class="btn btn-outline-info w-100 monto-rapido" data-valor="100000">$ 100.000</button></div>
              <div class="col-6"><button class="btn btn-outline-info w-100 monto-rapido" data-valor="200000">$ 200.000</button></div>
              <div class="col-6"><button class="btn btn-outline-info w-100 monto-rapido" data-valor="500000">$ 500.000</button></div>
            </div>
            <label for="cjValor" class="form-label">Otro valor</label>
            <input type="number" class="form-control mb-3" id="cjValor" min="1" step="1" placeholder="Ej: 150000">
            <button class="btn btn-info w-100 btn-cajero" id="btnConfirmarRetiro">Confirmar retiro</button>
          </div>
          <div id="resultadoRetiro" class="text-center d-none">
            <p class="mb-1">Retiro exitoso: <strong id="rtValor"></strong></p>
            <p class="mb-1">Nuevo saldo</p>
            <div class="cajero-saldo" id="rtSaldo"></div>
          </div>
          <div class="text-center mt-3"><button class="btn btn-outline-light volver-menu">Volver al menú</button></div>
        </section>

        <!-- MOVIMIENTOS -->
        <section id="seccionMovs" class="d-none">
          <h2 class="h5 text-center mb-3">Últimos movimientos</h2>
          <div class="tabla-scroll">
            <table class="table table-sm align-middle mb-0">
              <thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th class="text-end">Valor</th><th class="text-end">Saldo</th></tr></thead>
              <tbody id="tbCajeroMovs"></tbody>
            </table>
          </div>
          <div class="text-center mt-3"><button class="btn btn-outline-info volver-menu">Volver al menú</button></div>
        </section>
      </div>
    </div>
    <a href="/html/login.html" class="text-white-50 small mt-3">← Ir a la banca virtual</a>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/cajero.js"></script>
</body>
</html>
